<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Aurum · Acceso seguro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
:root{--bg:#090b11;--panel:#12151e;--elev:#1a1e2a;--border:#292e40;--text:#eef0f7;--muted:#9299ad;--accent:#6366f1;--accent2:#818cf8;--danger:#ef4444}
*{box-sizing:border-box;margin:0;padding:0}html,body{min-height:100%}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);display:grid;place-items:center;padding:24px;background-image:radial-gradient(800px 500px at 50% 0,rgba(99,102,241,.14),transparent 65%)}
.shell{width:min(420px,100%)}.brand{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:22px}
.logo{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),#4338ca);box-shadow:0 10px 30px rgba(79,70,229,.35)}.logo svg{width:25px}
.brand h1{font-size:20px;font-weight:800}.brand p{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;margin-top:2px}
.card{background:linear-gradient(180deg,#171a24,var(--panel));border:1px solid var(--border);border-radius:18px;padding:26px;box-shadow:0 18px 60px rgba(0,0,0,.35)}
.card h2{font-size:18px}.intro{color:var(--muted);font-size:13px;line-height:1.55;margin:7px 0 20px}
label{display:block;color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:7px}
.field{position:relative}.field input{width:100%;border:1px solid var(--border);background:var(--elev);color:var(--text);border-radius:11px;padding:13px 44px 13px 13px;font:500 15px Inter;outline:none;transition:.2s}.field input:focus{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(99,102,241,.15)}
.toggle{position:absolute;right:8px;top:7px;width:34px;height:34px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer}.toggle svg{width:18px}
.submit{width:100%;margin-top:15px;border:0;border-radius:11px;padding:13px;background:linear-gradient(135deg,var(--accent),#4f46e5);color:#fff;font:700 14px Inter;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:.15s}.submit:hover{filter:brightness(1.08)}.submit:disabled{opacity:.55;cursor:wait}.submit svg{width:17px}
.error{display:none;color:#fca5a5;background:#2b1315;border:1px solid #5b2326;border-radius:9px;padding:10px 12px;font-size:12px;margin-top:12px}.error.show{display:block}
.security{display:flex;gap:8px;align-items:flex-start;color:var(--muted);font-size:11px;line-height:1.5;margin-top:18px}.security svg{width:15px;flex:none;color:var(--accent2)}
.foot{text-align:center;color:#555d72;font-size:10.5px;margin-top:16px}
@media(max-width:600px){body{padding:max(18px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}.card{padding:22px 18px}.field input,.submit{min-height:50px}.toggle{width:44px;height:44px;top:3px}}
@media(pointer:coarse){button,input{touch-action:manipulation}}
</style>
</head>
<body>
<main class="shell">
  <div class="brand"><div class="logo"><i data-lucide="candlestick-chart"></i></div><div><h1>Aurum</h1><p>Trading console</p></div></div>
  <form class="card" id="form">
    <h2>Acceso al panel</h2>
    <p class="intro">Introduce la contraseña configurada para administrar el motor y las operaciones.</p>
    <label for="password">Contraseña</label>
    <div class="field">
      <input id="password" name="pin" type="password" autocomplete="current-password" maxlength="128" required autofocus>
      <button class="toggle" id="toggle" type="button" aria-label="Mostrar contraseña"><i data-lucide="eye"></i></button>
    </div>
    <button class="submit" id="submit" type="submit"><i data-lucide="log-in"></i><span>Entrar de forma segura</span></button>
    <div class="error" id="error" role="alert"></div>
    <div class="security"><i data-lucide="shield-check"></i><span>La sesión se almacena en una cookie firmada y no expone tu contraseña al navegador después del acceso.</span></div>
  </form>
  <div class="foot">Aurum · Entorno privado de administración</div>
</main>
<script>
lucide.createIcons();
const form=document.getElementById('form'),password=document.getElementById('password'),error=document.getElementById('error'),submit=document.getElementById('submit');
document.getElementById('toggle').addEventListener('click',()=>{password.type=password.type==='password'?'text':'password'});
form.addEventListener('submit',async event=>{
  event.preventDefault();error.classList.remove('show');submit.disabled=true;
  try{
    const body=new FormData(form),response=await fetch('/api/login',{method:'POST',body});
    if(response.ok){location.href='/';return}
    let message='Contraseña incorrecta.';
    try{const data=await response.json();if(data.detail)message=data.detail}catch(e){}
    error.textContent=message;error.classList.add('show');password.select();
  }catch(e){error.textContent='No se pudo conectar con el servidor.';error.classList.add('show')}
  finally{submit.disabled=false}
});
</script>
</body>
</html>
