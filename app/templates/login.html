<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Aurum · Acceso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
:root{
  --bg:#0a0c12; --panel:#12141d; --panel-2:#171a24; --elev:#1c2030;
  --border:#242838; --border-soft:#1c202e;
  --text:#e8eaf2; --muted:#8b92a7; --faint:#5b6178;
  --accent:#6366f1; --accent-2:#818cf8; --sell:#ef4444;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);
  -webkit-font-smoothing:antialiased;display:grid;place-items:center;min-height:100%;
  background-image:radial-gradient(1000px 500px at 50% -10%,rgba(99,102,241,.10),transparent 60%);
  user-select:none;
}
.login{width:min(360px,90vw);display:flex;flex-direction:column;align-items:center;padding:28px 22px}
.logo{
  width:54px;height:54px;border-radius:15px;display:grid;place-items:center;margin-bottom:16px;
  background:linear-gradient(135deg,var(--accent),#4f46e5);box-shadow:0 8px 22px rgba(79,70,229,.4);
}
.logo svg{width:28px;height:28px;color:#fff}
.login h1{font-size:19px;font-weight:800;letter-spacing:.2px}
.login .sub{font-size:12.5px;color:var(--muted);margin-top:4px;font-weight:500}

/* ---------- Puntos del PIN ---------- */
.dots{display:flex;gap:12px;height:16px;margin:26px 0 22px;align-items:center}
.dot{width:12px;height:12px;border-radius:50%;background:var(--elev);border:1.5px solid var(--border);transition:.15s}
.dot.on{background:var(--accent-2);border-color:var(--accent-2);box-shadow:0 0 0 4px rgba(129,140,248,.15)}
.dots.error .dot{border-color:var(--sell);background:transparent}
.dots.error .dot.on{background:var(--sell);border-color:var(--sell)}
.dots.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}

/* ---------- Teclado circular ---------- */
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.key{
  width:72px;height:72px;border-radius:50%;border:1px solid var(--border);
  background:linear-gradient(180deg,var(--panel-2),var(--panel));color:var(--text);
  font-family:inherit;font-size:26px;font-weight:600;cursor:pointer;display:grid;place-items:center;
  transition:transform .08s,background .15s;box-shadow:0 2px 6px rgba(0,0,0,.35);
}
.key:active{transform:scale(.92);background:var(--elev)}
.key.aux{background:transparent;border-color:transparent;box-shadow:none;color:var(--muted)}
.key.aux:active{background:var(--elev)}
.key.ok{color:var(--accent-2)}
.key svg{width:26px;height:26px}
.key[disabled]{opacity:.35;pointer-events:none}
.hint{margin-top:22px;font-size:11.5px;color:var(--faint);text-align:center;line-height:1.5}
.hint svg{width:13px;height:13px;vertical-align:-2px}
</style>
</head>
<body>
  <div class="login">
    <div class="logo"><i data-lucide="candlestick-chart"></i></div>
    <h1>Aurum</h1>
    <div class="sub">Introduce tu clave de acceso</div>

    <div class="dots" id="dots"></div>

    <div class="pad" id="pad">
      <button class="key" data-d="1">1</button>
      <button class="key" data-d="2">2</button>
      <button class="key" data-d="3">3</button>
      <button class="key" data-d="4">4</button>
      <button class="key" data-d="5">5</button>
      <button class="key" data-d="6">6</button>
      <button class="key" data-d="7">7</button>
      <button class="key" data-d="8">8</button>
      <button class="key" data-d="9">9</button>
      <button class="key aux" id="del" title="Borrar"><i data-lucide="delete"></i></button>
      <button class="key" data-d="0">0</button>
      <button class="key aux ok" id="ok" title="Entrar"><i data-lucide="arrow-right"></i></button>
    </div>

    <div class="hint"><i data-lucide="shield-check"></i> Conexión privada · Bot de trading</div>
  </div>

<script>
lucide.createIcons();
const $ = id => document.getElementById(id);
const dotsEl = $('dots');
let pin = '';
let enviando = false;

function pintar(){
  // Un punto por cada dígito introducido (crece a medida que escribes)
  const n = Math.max(pin.length, 4);
  let html = '';
  for(let i=0;i<n;i++) html += `<div class="dot ${i<pin.length?'on':''}"></div>`;
  dotsEl.innerHTML = html;
}
pintar();

function meter(d){
  if(enviando || pin.length >= 32) return;
  pin += d; pintar();
}
function borrar(){
  if(enviando) return;
  pin = pin.slice(0,-1); pintar();
}
function error(){
  dotsEl.classList.add('error','shake');
  setTimeout(()=>{ pin=''; dotsEl.classList.remove('error','shake'); pintar(); }, 500);
}

async function entrar(){
  if(enviando || !pin.length) return;
  enviando = true;
  try{
    const fd = new FormData(); fd.append('pin', pin);
    const r = await fetch('/api/login', {method:'POST', body:fd});
    if(r.ok){ location.href = '/'; return; }
    error();
  }catch(e){ error(); }
  enviando = false;
}

// Botones táctiles
$('pad').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  if(b.id==='del') return borrar();
  if(b.id==='ok')  return entrar();
  if(b.dataset.d)  meter(b.dataset.d);
});

// Teclado físico (por si entras desde un PC)
window.addEventListener('keydown', e=>{
  if(e.key >= '0' && e.key <= '9') meter(e.key);
  else if(e.key === 'Backspace') borrar();
  else if(e.key === 'Enter') entrar();
});
</script>
</body>
</html>
