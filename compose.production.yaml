services:
  aurum:
    environment:
      ENVIRONMENT: production
      COOKIE_SECURE: "true"
      ALLOWED_HOSTS: ${DOMAIN:?Configura DOMAIN en .env}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      aurum:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?Configura DOMAIN en .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true

volumes:
  caddy_data:
  caddy_config:
