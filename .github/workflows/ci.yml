name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          DATA_DIR: /tmp/aurum-tests
          PANEL_PASSWORD: unit-test-password
          SESSION_SECRET: unit-test-session-secret-at-least-32-characters
        run: python -m unittest discover -s tests -v
      - name: Validate application import
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -c "import app.main; print('Application import OK')"
