services:
  aurum:
    build: .
    image: aurum:local
    env_file: .env
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - aurum_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true

volumes:
  aurum_data:
